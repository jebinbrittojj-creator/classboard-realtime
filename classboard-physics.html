<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classboard Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#0F1419; --surface:#1A2332; --ink:#E8F0F7; --muted:#7A8BA0; --line:#2C3E52;
  --board:#0D3B66; --board-edge:#051D38; --chalk:#F0F4F8; --chalk-dim:#8BA4BF;
  --accent:#00D9FF; --accent-alt:#FF006E; --live:#FF4757; --ok:#2ED573; --focus:#00B4D8;
  --physics-glow:#00D9FF; --physics-alt:#FF006E;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Kalam","Comic Neue","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --paper:#F5F8FB; --surface:#FFFFFF; --ink:#0B1929; --muted:#5A7089; --line:#D0DDE9;
    --board:#1F5C8C; --board-edge:#133A5C; --chalk:#F8FAFC; --chalk-dim:#6B8DAF;
    --accent:#0096D6; --accent-alt:#D10368; --physics-glow:#0096D6;
  }
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.03) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(255, 0, 110, 0.02) 0%, transparent 50%);z-index:-1}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img{max-width:100%}

/* physics particles */
.particle-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.particle{position:absolute;border-radius:50%;opacity:.3;animation:drift 8s infinite ease-in-out}
.particle.small{width:2px;height:2px;background:var(--physics-glow)}
.particle.medium{width:4px;height:4px;background:var(--physics-alt)}
.particle.large{width:6px;height:6px;background:var(--accent)}
@keyframes drift{0%,100%{transform:translateY(0) translateX(0);opacity:.2} 50%{opacity:.4}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:40px;padding:.45em 1em;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.95rem;white-space:nowrap;text-decoration:none;position:relative;z-index:1;transition:all .2s ease}
.btn:hover{border-color:var(--accent);box-shadow:0 0 12px rgba(0, 217, 255, 0.2)}
.btn.primary{background:var(--board);border-color:var(--accent);color:var(--chalk);box-shadow:0 0 8px rgba(0, 217, 255, 0.1)}
.btn.primary:hover{background:#0a2d4d;box-shadow:0 0 16px rgba(0, 217, 255, 0.3)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink)}
.btn.ghost:hover{border-color:var(--line);background:rgba(0,217,255,.05)}
.btn.danger{color:var(--live)}
.btn.icon{min-width:40px;padding:.45em .6em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkish{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:700}

/* science badge */
.science-badge{display:inline-block;padding:.2em .6em;background:linear-gradient(135deg, var(--accent), var(--accent-alt));border-radius:999px;color:#000;font-size:.75rem;font-weight:700;margin-left:8px}

/* chalkboard */
.board-frame{container-type:inline-size;width:100%;position:relative;z-index:1}
.board{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg, var(--board) 0%, #0a2d4d 100%);color:var(--chalk);border-radius:clamp(4px,1.4cqw,16px);box-shadow:0 0 20px rgba(0, 217, 255, 0.2), inset 0 0 0 clamp(3px,1.1cqw,12px) var(--board-edge);padding:6cqw 7cqw 5cqw;display:grid;grid-template-columns:1fr;align-content:start;gap:3cqw;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 30% 20%,rgba(0, 217, 255, 0.08),transparent 60%)}
.board.with-image{grid-template-columns:1.15fr .85fr;align-items:center;align-content:center}
.board-title{font-family:var(--hand);font-weight:700;font-size:5.4cqw;line-height:1.15;margin:0;color:var(--chalk);overflow-wrap:anywhere;text-shadow:0 2px 4px rgba(0, 0, 0, 0.3)}
.board-title::after{content:"";display:block;width:13cqw;height:.55cqw;margin-top:1.3cqw;border-radius:1cqw;background:linear-gradient(90deg, var(--accent), var(--accent-alt));opacity:.95;box-shadow:0 0 12px var(--accent)}
.board-points{margin:2.4cqw 0 0;padding-left:3.6cqw;font-size:2.8cqw;line-height:1.45}
.board-points li{margin:.5cqw 0;overflow-wrap:anywhere}
.board-points li::marker{color:var(--accent);font-weight:700}
.board.dense .board-points{font-size:2.2cqw}
.board-img{display:block;max-width:100%;max-height:34cqw;margin:auto;object-fit:contain;border-radius:1cqw;background:#fff;border:2px solid var(--accent);box-shadow:0 0 12px rgba(0, 217, 255, 0.15)}
.board-count{position:absolute;right:3.2cqw;bottom:2.2cqw;font-size:1.7cqw;color:var(--chalk-dim)}
.board.page{padding:0;display:block}
.board.page img{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit;border:2px solid var(--accent)}
.board-empty{font-family:var(--hand);color:var(--chalk-dim);font-size:3.4cqw;align-self:center;justify-self:center;margin-top:12cqw}
.is-thumb .board{padding:6cqw 7cqw;box-shadow:0 0 10px rgba(0, 217, 255, 0.1), inset 0 0 0 3px var(--board-edge)}
.is-thumb .board.page{padding:0}
.is-thumb .board-points,.is-thumb .board-count{display:none}
.is-thumb .board-title{font-size:9cqw}
.is-thumb .board-title::after{height:1.2cqw;margin-top:2cqw}
.is-thumb .board-empty{font-size:8cqw;margin-top:14cqw}
.fade{animation:fade .22s ease-out}
@keyframes fade{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* shell */
.shell{min-height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-bottom:2px solid var(--line);backdrop-filter:blur(10px);background-color:rgba(26, 35, 50, 0.95)}
.brand{font-family:var(--hand);font-weight:700;font-size:1.45rem;line-height:1;color:var(--accent);text-shadow:0 0 8px rgba(0, 217, 255, 0.3)}
.deck-title{flex:1 1 220px;min-width:0;border:1.5px solid transparent;border-radius:8px;background:transparent;padding:.35em .5em;font-size:1.1rem;font-weight:700;transition:all .2s ease}
.deck-title:hover{border-color:var(--accent);background:rgba(0, 217, 255, 0.05)}
.deck-title-static{flex:1 1 200px;min-width:0;font-weight:700;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-state{font-size:.85rem;color:var(--muted);min-width:9em}
.save-state.err{color:var(--live);font-weight:700}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.live-pill{display:inline-flex;align-items:center;gap:.45em;padding:.25em .75em;border-radius:999px;background:var(--live);color:#fff;font-weight:700;font-size:.85rem;box-shadow:0 0 8px rgba(255, 71, 87, 0.3)}
.live-pill::before{content:"";width:.55em;height:.55em;border-radius:50%;background:#fff;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:1}}
.notice{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:rgba(0, 217, 255, 0.05);border-bottom:1px solid var(--line);font-size:.95rem}

/* setup */
.setup{flex:1;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0;position:relative;z-index:1}
.rail{border-right:1px solid var(--line);padding:16px;overflow:auto;max-height:calc(100dvh - 70px);position:sticky;top:62px;background:rgba(26, 35, 50, 0.5);backdrop-filter:blur(5px)}
.rail-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.thumb{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;width:100%;padding:6px;border:2px solid transparent;border-radius:10px;background:none;cursor:pointer;text-align:left;transition:all .2s ease}
.thumb:hover{border-color:var(--accent);background:rgba(0, 217, 255, 0.05)}
.thumb.is-selected{border-color:var(--accent);background:rgba(0, 217, 255, 0.1);box-shadow:0 0 12px rgba(0, 217, 255, 0.2)}
.thumb-num{font-size:.8rem;color:var(--muted);font-weight:700;padding-top:2px;text-align:right}
.rail-actions{display:grid;gap:8px;margin-top:16px}
.rail-actions .btn{white-space:normal;text-align:center}
.editor{padding:24px clamp(16px,3vw,40px) 48px;min-width:0;position:relative;z-index:1}
.editor-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.editor-head h2{margin:0;font-size:1.05rem;color:var(--muted)}
.editor-tools{display:flex;gap:6px;margin-left:auto}
.editor-grid{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:28px;align-items:start}
.fields{display:grid;gap:18px}
.field{display:grid;gap:6px}
.field-label,.field>span{font-weight:700;color:var(--ink)}
.field small{color:var(--muted);font-size:.85rem;margin-top:-4px}
.field input,.field textarea,.input{width:100%;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:.6em .7em;color:var(--ink);transition:all .2s ease}
.field input:focus,.field textarea:focus,.input:focus{border-color:var(--accent);background:rgba(0, 217, 255, 0.02);box-shadow:0 0 8px rgba(0, 217, 255, 0.1)}
.field textarea{resize:vertical;min-height:170px;line-height:1.45}
.image-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.image-row img{width:72px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--accent);background:#fff}
.editor-preview{position:sticky;top:90px}
.preview-caption{margin:10px 0 0;color:var(--muted);font-size:.9rem}
.empty{max-width:34em;margin:10vh auto;text-align:center}
.empty h2{font-family:var(--hand);font-size:2rem;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 20px}

/* live */
.live{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0;position:relative;z-index:1}
.stage-col{padding:20px clamp(12px,2.5vw,32px);display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.stage{position:relative;width:min(100%,calc((100dvh - 190px) * 16 / 9));min-width:280px}
.stage:fullscreen{width:100vw;height:100vh;display:grid;place-items:center;background:#0c1512}
.stage:fullscreen .board-frame{width:min(100vw,calc(100vh * 16 / 9))}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.counter{min-width:6em;text-align:center;font-weight:700;color:var(--accent)}
.up-next{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.up-next .board-frame{width:120px}
.qr-overlay{position:absolute;inset:0;z-index:2;display:grid;place-items:center;align-content:center;gap:2cqw;background:linear-gradient(135deg, var(--board), #0a2d4d);color:var(--chalk);border-radius:clamp(4px,1.4cqw,16px);text-align:center;container-type:inline-size;padding:3cqw;box-shadow:0 0 20px rgba(0, 217, 255, 0.2)}
.qr-overlay h2{font-family:var(--hand);font-size:4.6cqw;margin:0;line-height:1.1;color:var(--accent)}
.qr-overlay .qr{width:min(34cqw,60vh);background:#fff;padding:1.6cqw;border-radius:1.2cqw;box-shadow:0 0 12px rgba(0, 217, 255, 0.15)}
.qr-overlay p{margin:0;font-size:1.9cqw;color:var(--chalk-dim);max-width:70cqw;overflow-wrap:anywhere}
.side{border-left:1px solid var(--line);background:rgba(26, 35, 50, 0.5);backdrop-filter:blur(5px);padding:18px;display:flex;flex-direction:column;gap:22px;overflow:auto;max-height:calc(100dvh - 62px);position:sticky;top:62px}
.side h3{margin:0 0 8px;font-size:1rem;color:var(--accent)}
.link-box{display:flex;gap:6px}
.link-box input{flex:1;min-width:0;font-size:.85rem;background:var(--surface);border:1px solid var(--line);padding:.4em .6em;border-radius:6px;color:var(--ink)}
.qr{width:150px;margin-top:12px;background:#fff;padding:8px;border-radius:8px;border:2px solid var(--accent);box-shadow:0 0 12px rgba(0, 217, 255, 0.2)}
.qr img,.qr canvas{display:block;width:100%!important;height:auto!important}
.hint{color:var(--muted);font-size:.88rem;margin:10px 0 0}
.counts{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.people{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.people li{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.person-name{font-weight:700;line-height:1.25;overflow-wrap:anywhere;color:var(--ink)}
.person-mail{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}

/* participant */
.student{min-height:100dvh;display:flex;flex-direction:column}
.student-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:2px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);background-color:rgba(26, 35, 50, 0.95)}
.student-bar{flex-wrap:nowrap}
.student-bar .who{margin-left:auto;font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
@media (max-width:480px){.who-label{display:none}}
.student-main .deck-title-static{flex:none;max-width:100%}
.student-main .board-points{font-size:max(2.8cqw,13px)}
.student-main .board-title{font-size:max(5.4cqw,20px)}
.student-main .board.dense .board-points{font-size:max(2.2cqw,12px)}
.student-main{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 16px;gap:14px}
.student-main .stage{width:min(100%,calc((100dvh - 200px) * 16 / 9))}
.join-card{width:min(calc(100% - 32px),440px);margin:6vh auto 0;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:28px;box-shadow:0 0 20px rgba(0, 217, 255, 0.1)}
.join-card h1{font-family:var(--hand);font-size:2rem;line-height:1.15;margin:0 0 6px;overflow-wrap:anywhere;color:var(--accent)}
.join-card>p{color:var(--muted);margin:0 0 20px}
.as-name{margin:10px 0 0;font-size:.95rem;color:var(--ink)}
.as-name strong{font-size:1.05rem;color:var(--accent)}
.err-msg{color:var(--live);font-weight:700;font-size:.92rem;margin:10px 0 0}
.join-card .btn{width:100%;margin-top:20px}
.message{max-width:30em;margin:14vh auto;text-align:center;padding:0 20px}
.message h1{font-family:var(--hand);font-size:2.1rem;margin:0 0 8px;line-height:1.15;color:var(--accent)}
.message p{color:var(--muted)}
.follow-note{color:var(--muted);font-size:.9rem;margin:0;text-align:center}
.preview-flip{display:inline-flex;gap:6px}
.preview-banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;background:linear-gradient(135deg, var(--accent), var(--accent-alt));color:#000;font-weight:700}

/* dialog + toast */
dialog{border:2px solid var(--accent);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(92vw,520px);box-shadow:0 0 30px rgba(0, 217, 255, 0.2)}
dialog::backdrop{background:rgba(10,20,17,.7)}
.dlg{padding:24px;display:grid;gap:14px}
.dlg h2{margin:0;font-size:1.3rem;color:var(--accent)}
.dlg p{margin:0;color:var(--muted)}
.dlg textarea{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;background:rgba(0,217,255,.02);border:1px solid var(--line);color:var(--ink)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 0 16px rgba(0, 217, 255, 0.3)}
#toast.show{opacity:1}

@media (max-width:900px){
  .setup{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .rail-list{grid-auto-flow:column;grid-auto-columns:150px}
  .rail-actions{display:flex;flex-wrap:wrap}
  .editor-grid{grid-template-columns:1fr}
  .editor-preview{position:static;order:-1}
  .live{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}
  .topbar{position:static}
}
[hidden]{display:none!important}

/* MCQ styling */
.board.mcq{grid-template-rows:auto 1fr auto;align-content:stretch;gap:2.4cqw}
.board-title.mcq-q{font-size:4.2cqw;color:var(--accent)}
.mcq-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw;align-content:center}
.mcq-opt{position:relative;display:flex;align-items:center;gap:1.6cqw;padding:1.4cqw 2cqw;border:2px solid rgba(0, 217, 255, 0.3);border-radius:1.2cqw;font-size:2.6cqw;overflow:hidden;min-height:7cqw;background:rgba(0, 217, 255, 0.05);transition:all .2s ease}
.mcq-opt:hover{border-color:var(--accent);box-shadow:0 0 12px rgba(0, 217, 255, 0.2)}
.mcq-letter{position:relative;z-index:1;flex:none;display:grid;place-items:center;width:4.4cqw;height:4.4cqw;border-radius:50%;background:linear-gradient(135deg, var(--accent), var(--accent-alt));color:#000;font-weight:700;font-size:2.4cqw;box-shadow:0 0 8px rgba(0, 217, 255, 0.3)}
.mcq-text{position:relative;z-index:1;flex:1;overflow-wrap:anywhere;color:var(--chalk)}
.mcq-count{position:relative;z-index:1;font-weight:700;font-size:2.4cqw;white-space:nowrap;color:var(--accent)}
.mcq-bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg, rgba(0, 217, 255, 0.2), rgba(255, 0, 110, 0.1));z-index:0;box-shadow:inset -1px 0 0 rgba(0, 217, 255, 0.3)}
.mcq-opt.is-correct{border-color:var(--ok);background:rgba(46, 213, 115, 0.1)}
.mcq-opt.is-correct .mcq-letter{background:linear-gradient(135deg, var(--ok), #1abc9c)}
.mcq-opt.is-correct .mcq-bar{background:rgba(46, 213, 115, 0.2)}
.mcq-opt.is-dim{opacity:.5}
.mcq-summary{font-family:var(--hand);font-weight:700;font-size:3cqw;color:var(--accent);text-align:center;line-height:1.2;text-shadow:0 0 8px rgba(0, 217, 255, 0.3)}
.answered-chip{position:absolute;top:2.2cqw;right:3cqw;z-index:2;padding:.6cqw 1.6cqw;border-radius:99px;background:rgba(0, 217, 255, 0.15);border:2px solid var(--accent);color:var(--chalk);font-size:1.8cqw;font-weight:700}
.mcq-results{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgba(5, 29, 56, 0.95);color:var(--chalk);padding:1.8cqw 3cqw 2.2cqw;display:grid;gap:1.2cqw;border-top:2px solid var(--accent)}
.mcq-results .row{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw}
.mcq-results .mcq-opt{min-height:0;padding:1cqw 1.4cqw;font-size:2.2cqw;justify-content:space-between}
.mcq-results .mcq-letter{width:3.6cqw;height:3.6cqw;font-size:2cqw}
.is-thumb .answered-chip,.is-thumb .mcq-summary,.is-thumb .mcq-results{display:none}

/* TPS styling */
.board.tps{align-content:center;justify-items:center;text-align:center;gap:2cqw}
.board.tps .board-title::after{margin-left:auto;margin-right:auto;background:linear-gradient(90deg, var(--accent), var(--accent-alt))}
.tps-kicker{margin:0;font-weight:700;color:var(--accent);font-size:2.3cqw;text-shadow:0 0 8px rgba(0, 217, 255, 0.2)}
.tps-q{margin:0;font-size:2.3cqw;color:var(--chalk);max-width:84cqw;overflow-wrap:anywhere;line-height:1.35}
.tps-word{font-family:var(--hand);font-weight:700;font-size:15cqw;line-height:1;background:linear-gradient(135deg, var(--accent), var(--accent-alt));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.04em;text-shadow:0 0 20px rgba(0, 217, 255, 0.2);filter:drop-shadow(0 0 10px rgba(0, 217, 255, 0.3))}
.tps-word.small{font-size:6cqw}
.tps-sub{margin:0;font-size:2.8cqw;color:var(--chalk-dim)}
.tps-timer{font-size:7cqw;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent);text-shadow:0 0 12px rgba(0, 217, 255, 0.4)}
.tps-timer.done{color:var(--ok);font-size:4.4cqw;font-family:var(--hand)}
.board.tps-share{align-content:start;gap:1.4cqw}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1cqw 2.6cqw;max-width:90cqw;font-family:var(--hand);font-weight:700;line-height:1.05}
.cloud-word{overflow-wrap:anywhere}
.cloud-word.c0{color:var(--accent)} .cloud-word.c1{color:#FF006E} .cloud-word.c2{color:#00B4D8} .cloud-word.c3{color:#00D9FF} .cloud-word.c4{color:#90E0EF}
.answers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(19cqw,1fr));gap:1cqw;width:100%;text-align:left;align-content:start}
.answer-card{background:rgba(0, 217, 255, 0.08);border-radius:1cqw;padding:.9cqw 1.3cqw;min-width:0;border:1px solid var(--accent);backdrop-filter:blur(2px)}
.answer-card b{display:block;font-size:1.5cqw;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.answer-card span{display:block;font-size:2cqw;overflow-wrap:anywhere;color:var(--chalk)}

/* tables and progress */
.progress{flex:1;width:min(100%,1100px);margin:0 auto;padding:24px clamp(16px,3vw,40px) 60px}
.progress h2{font-size:1.25rem;margin:28px 0 8px;color:var(--ink)}
.progress-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.progress-head h2{margin-top:0}
.progress-head select{width:auto}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ptable{width:100%;border-collapse:collapse;font-size:.95rem}
.ptable th,.ptable td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink)}
.ptable th{font-size:.85rem;color:var(--accent);font-weight:700;white-space:nowrap;background:rgba(0, 217, 255, 0.05)}
.ptable tr:last-child td{border-bottom:0}
.ptable .num{text-align:right;font-variant-numeric:tabular-nums}
.score{display:inline-flex;align-items:center;gap:8px}
.score-bar{width:90px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:inline-block}
.score-bar span{display:block;height:100%}
.score-num{font-weight:700;font-variant-numeric:tabular-nums;min-width:3ch;color:var(--accent)}
.hi{background:linear-gradient(90deg, var(--ok), #1abc9c)} .mid{background:linear-gradient(90deg, var(--accent), var(--accent-alt))} .lo{background:linear-gradient(90deg, var(--live), #ff6b6b)}
.trend{display:inline-flex;align-items:flex-end;gap:3px;height:28px}
.tbar{width:8px;border-radius:2px 2px 0 0}
.tbar.none{background:var(--line)}

/* kind tags */
.kind-tag{grid-column:2;justify-self:start;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:linear-gradient(135deg, var(--accent), var(--accent-alt));color:#000;margin-top:2px}
.type-row{display:flex;align-items:center;gap:8px;margin-right:auto}
.type-row select{width:auto;min-height:40px;background:var(--surface);border:1px solid var(--line);padding:.4em .6em;border-radius:6px;color:var(--ink)}

/* responsive updates */
.choice{border:2px solid var(--line);background:var(--surface);transition:all .2s ease}
.choice:hover{border-color:var(--accent);box-shadow:0 0 12px rgba(0, 217, 255, 0.2)}
.choice.is-picked{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.choice.is-picked .letter{background:linear-gradient(135deg, var(--accent), var(--accent-alt));color:#000}
.choice.is-correct{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.choice.is-correct .letter{background:var(--ok);color:#fff}
.choice .letter{background:var(--board);color:var(--chalk)}
</style>

// Initialize physics particles
function initializeParticles() {
  const container = document.getElementById('particleContainer');
  const particleCount = Math.min(20, Math.max(8, Math.floor(window.innerWidth / 200)));

  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    const size = Math.random() * 3;
    const sizeClass = size < 1 ? 'small' : size < 2 ? 'medium' : 'large';
    particle.className = `particle ${sizeClass}`;

    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = Math.random() * 100 + '%';
    particle.style.animationDuration = (5 + Math.random() * 10) + 's';
    particle.style.animationDelay = Math.random() * 5 + 's';

    container.appendChild(particle);
  }
}

initializeParticles();
window.addEventListener('resize', () => {
  document.getElementById('particleContainer').innerHTML = '';
  initializeParticles();
});

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "value") e.value = v;
    else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
