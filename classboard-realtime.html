<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Learning Platform - Real-Time</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #00d9ff;
      --secondary: #ff006e;
      --accent: #8338ec;
      --bg: #0a0e27;
      --surface: #16213e;
      --text: #eaeaea;
      --border: #00d9ff80;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #1a1f3a 100%);
      color: var(--text);
      line-height: 1.6;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    header {
      background: linear-gradient(90deg, var(--surface) 0%, rgba(51, 56, 236, 0.1) 100%);
      border-bottom: 2px solid var(--border);
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 8px;
    }

    h1 { font-size: 28px; color: var(--primary); }

    .header-right { display: flex; gap: 15px; align-items: center; }

    .auth-section {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .auth-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 10px 15px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    button {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 217, 255, 0.3);
    }

    .section {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    .section h2 {
      color: var(--primary);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .leaderboard {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rank-item {
      background: linear-gradient(90deg, rgba(0, 217, 255, 0.1) 0%, rgba(51, 56, 236, 0.1) 100%);
      padding: 15px;
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }

    .rank-item:hover {
      background: linear-gradient(90deg, rgba(0, 217, 255, 0.2) 0%, rgba(51, 56, 236, 0.2) 100%);
      transform: translateX(5px);
    }

    .rank-badge {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    .student-name { flex-grow: 1; }
    .score-display { color: var(--primary); font-weight: bold; font-size: 16px; }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--primary);
      color: #000;
      padding: 15px 20px;
      border-radius: 6px;
      font-weight: bold;
      animation: slideIn 0.3s ease;
      z-index: 1000;
    }

    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .real-time-badge {
      background: linear-gradient(90deg, #00ff00, #00cc00);
      color: #000;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .canvas-container {
      background: linear-gradient(135deg, #1a1f3a 0%, #0a0e27 100%);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    canvas {
      display: block;
      max-width: 100%;
      margin: 0 auto;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
    }

    .modal-content {
      background: var(--surface);
      margin: 10% auto;
      padding: 30px;
      border: 2px solid var(--primary);
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .close {
      color: var(--primary);
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover { color: var(--secondary); }

    .status-online {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #00ff00;
      font-weight: bold;
    }

    .status-online::before {
      content: '';
      width: 10px;
      height: 10px;
      background: #00ff00;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎓 Interactive Learning Platform - Real-Time</h1>
      <div class="header-right">
        <span id="statusIndicator" class="status-online">● Live Connected</span>
      </div>
    </header>

    <!-- Authentication Section -->
    <div class="auth-section" id="authSection">
      <h2>🔐 Authentication</h2>
      <div class="auth-form">
        <input type="email" id="authEmail" placeholder="your@email.com">
        <input type="password" id="authPassword" placeholder="Password">
        <select id="authRole">
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
        </select>
        <button onclick="register()">Register</button>
        <button onclick="login()">Login</button>
      </div>
      <div id="authStatus" style="margin-top: 10px; color: var(--primary);"></div>
    </div>

    <!-- Main Dashboard (Hidden until logged in) -->
    <div id="dashboard" style="display: none;">
      <!-- Class Management -->
      <div class="section">
        <h2>📚 Class Management</h2>
        <div class="auth-form">
          <input type="text" id="className" placeholder="Class name (e.g., Physics 101)">
          <button onclick="createClass()">Create Class</button>
          <select id="classSelector" onchange="selectClass()">
            <option value="">Select a class...</option>
          </select>
        </div>
      </div>

      <!-- Live Leaderboard -->
      <div class="section" id="leaderboardSection" style="display: none;">
        <h2>🏆 Live Leaderboard <span class="real-time-badge">LIVE</span></h2>
        <button onclick="updateLeaderboard()">📊 Refresh Rankings</button>
        <div id="leaderboard" class="leaderboard" style="margin-top: 15px;"></div>
      </div>

      <!-- Student Management -->
      <div class="section" id="studentSection" style="display: none;">
        <h2>👥 Add Students</h2>
        <div class="auth-form">
          <input type="email" id="studentEmail" placeholder="student@school.com">
          <input type="text" id="studentName" placeholder="Student Name">
          <button onclick="addStudent()">➕ Add Student</button>
        </div>
        <div id="studentList" style="margin-top: 15px;"></div>
      </div>

      <!-- Grading -->
      <div class="section" id="gradingSection" style="display: none;">
        <h2>✏️ Auto-Grade Students</h2>
        <button onclick="gradeAllStudents()">🎯 Auto-Grade Now</button>
        <div id="gradingResults" style="margin-top: 15px;"></div>
      </div>

      <!-- Analytics -->
      <div class="section" id="analyticsSection" style="display: none;">
        <h2>📈 Analytics & Reports</h2>
        <button onclick="generateAnalytics()">📊 Generate Report</button>
        <div id="analyticsData" style="margin-top: 15px;"></div>
      </div>

      <!-- Physics Simulations -->
      <div class="section" id="simulationSection" style="display: none;">
        <h2>🔬 Physics Simulations</h2>
        <div class="auth-form">
          <button onclick="runSimulation('gravity')">🌍 Gravity</button>
          <button onclick="runSimulation('pendulum')">📍 Pendulum</button>
          <button onclick="runSimulation('spring')">⚙️ Spring</button>
          <button onclick="runSimulation('wave')">〰️ Wave</button>
        </div>
        <div class="canvas-container">
          <canvas id="simCanvas" width="800" height="300"></canvas>
        </div>
      </div>

      <!-- Export -->
      <div class="section" id="exportSection" style="display: none;">
        <h2>💾 Export Data</h2>
        <button onclick="exportToCSV()">📥 Download CSV</button>
        <button onclick="exportToJSON()">📤 Download JSON</button>
      </div>

      <!-- Attendance -->
      <div class="section" id="attendanceSection" style="display: none;">
        <h2>📋 Attendance Tracking</h2>
        <button onclick="updateAttendance()">📍 Mark Attendance</button>
        <div id="attendanceChart" class="canvas-container">
          <canvas id="attendanceCanvas" width="800" height="250"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    let socket;
    let authToken = localStorage.getItem('authToken');
    let currentUserId = localStorage.getItem('userId');
    let currentUserRole = localStorage.getItem('userRole');
    let currentClassId = null;
    let students = [];
    let animationId = null;

    // Initialize Socket.IO
    function initSocket() {
      const apiUrl = localStorage.getItem('apiUrl') || 'http://localhost:3000';
      socket = io(apiUrl);

      socket.on('connect', () => {
        showToast('✓ Connected to server');
        document.getElementById('statusIndicator').innerHTML = '● Live Connected';
        if (currentClassId) socket.emit('join_class', currentClassId);
      });

      socket.on('disconnect', () => {
        document.getElementById('statusIndicator').innerHTML = '○ Disconnected';
      });

      socket.on('student_added', (data) => {
        if (data.classId === currentClassId) loadStudents();
      });

      socket.on('grade_updated', (data) => {
        if (data.classId === currentClassId) {
          updateLeaderboard();
          showToast(`✓ ${data.studentId} graded: ${data.score}%`);
        }
      });

      socket.on('attendance_updated', (data) => {
        if (data.classId === currentClassId) drawAttendanceChart();
      });
    }

    // Auth Functions
    async function register() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const role = document.getElementById('authRole').value;
      const apiUrl = prompt('Enter API URL (e.g., http://localhost:3000):') || 'http://localhost:3000';

      try {
        const res = await fetch(`${apiUrl}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role })
        });
        const data = await res.json();

        if (data.token) {
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('userRole', role);
          localStorage.setItem('apiUrl', apiUrl);
          authToken = data.token;
          currentUserId = data.userId;
          currentUserRole = role;
          showDashboard();
          initSocket();
        }
      } catch (error) {
        showToast('❌ Registration failed: ' + error.message);
      }
    }

    async function login() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const apiUrl = localStorage.getItem('apiUrl') || prompt('Enter API URL (e.g., http://localhost:3000):') || 'http://localhost:3000';

      try {
        const res = await fetch(`${apiUrl}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.token) {
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('userRole', data.role);
          localStorage.setItem('apiUrl', apiUrl);
          authToken = data.token;
          currentUserId = data.userId;
          currentUserRole = data.role;
          showDashboard();
          initSocket();
        }
      } catch (error) {
        showToast('❌ Login failed: ' + error.message);
      }
    }

    function showDashboard() {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadClasses();
    }

    // Class Functions
    async function createClass() {
      const name = document.getElementById('className').value;
      const apiUrl = localStorage.getItem('apiUrl');

      try {
        const res = await fetch(`${apiUrl}/api/classes`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        showToast(`✓ Class created! Code: ${data.code}`);
        loadClasses();
      } catch (error) {
        showToast('❌ Error creating class');
      }
    }

    async function loadClasses() {
      const apiUrl = localStorage.getItem('apiUrl');
      try {
        const res = await fetch(`${apiUrl}/api/classes`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const classes = await res.json();

        const selector = document.getElementById('classSelector');
        selector.innerHTML = '<option value="">Select a class...</option>';
        classes.forEach(cls => {
          const option = document.createElement('option');
          option.value = cls.id;
          option.textContent = cls.name;
          selector.appendChild(option);
        });
      } catch (error) {
        showToast('❌ Error loading classes');
      }
    }

    function selectClass() {
      currentClassId = document.getElementById('classSelector').value;
      if (currentClassId) {
        socket.emit('join_class', currentClassId);
        document.getElementById('leaderboardSection').style.display = 'block';
        document.getElementById('studentSection').style.display = 'block';
        document.getElementById('gradingSection').style.display = 'block';
        document.getElementById('analyticsSection').style.display = 'block';
        document.getElementById('simulationSection').style.display = 'block';
        document.getElementById('exportSection').style.display = 'block';
        document.getElementById('attendanceSection').style.display = 'block';
        loadStudents();
      }
    }

    // Student Functions
    async function addStudent() {
      const email = document.getElementById('studentEmail').value;
      const name = document.getElementById('studentName').value;
      const apiUrl = localStorage.getItem('apiUrl');

      try {
        const res = await fetch(`${apiUrl}/api/classes/${currentClassId}/students`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ email, name })
        });
        showToast('✓ Student added');
        document.getElementById('studentEmail').value = '';
        document.getElementById('studentName').value = '';
        loadStudents();
      } catch (error) {
        showToast('❌ Error adding student');
      }
    }

    async function loadStudents() {
      const apiUrl = localStorage.getItem('apiUrl');
      try {
        const res = await fetch(`${apiUrl}/api/classes/${currentClassId}/students`);
        students = await res.json();

        let html = '';
        students.forEach(s => {
          html += `<div style="padding: 10px; background: rgba(0, 217, 255, 0.1); margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between;">
            <div><strong>${s.name}</strong><br>${s.email}</div>
            <div>Score: ${Math.round(s.score)}% | Attendance: ${Math.round(s.attendance)}%</div>
            <button onclick="deleteStudent(${s.id})" style="background: var(--secondary); padding: 5px 10px;">Delete</button>
          </div>`;
        });
        document.getElementById('studentList').innerHTML = html || 'No students added yet';
      } catch (error) {
        showToast('❌ Error loading students');
      }
    }

    async function deleteStudent(id) {
      const apiUrl = localStorage.getItem('apiUrl');
      try {
        await fetch(`${apiUrl}/api/students/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
        loadStudents();
      } catch (error) {
        showToast('❌ Error deleting student');
      }
    }

    // Grading Functions
    async function gradeAllStudents() {
      const apiUrl = localStorage.getItem('apiUrl');
      let graded = 0;

      for (const student of students) {
        const score = Math.random() * 40 + 60;
        try {
          await fetch(`${apiUrl}/api/students/${student.id}/grade`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ score, feedback: 'Auto-graded', classId: currentClassId })
          });
          graded++;
        } catch (error) {}
      }
      showToast(`✓ Graded ${graded} students`);
      updateLeaderboard();
    }

    // Leaderboard
    async function updateLeaderboard() {
      const apiUrl = localStorage.getItem('apiUrl');
      try {
        const res = await fetch(`${apiUrl}/api/classes/${currentClassId}/students`);
        const students = await res.json();

        students.sort((a, b) => b.score - a.score);

        let html = '';
        students.forEach((s, idx) => {
          html += `<div class="rank-item">
            <span class="rank-badge">${idx + 1}</span>
            <span class="student-name">${s.name} (${s.email})</span>
            <span class="score-display">${Math.round(s.score)}%</span>
          </div>`;
        });
        document.getElementById('leaderboard').innerHTML = html;
        socket.emit('grade_submitted', { classId: currentClassId });
      } catch (error) {
        showToast('❌ Error updating leaderboard');
      }
    }

    // Analytics
    async function generateAnalytics() {
      const apiUrl = localStorage.getItem('apiUrl');
      try {
        const res = await fetch(`${apiUrl}/api/classes/${currentClassId}/analytics`);
        const data = await res.json();

        let html = `
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div style="background: rgba(0, 217, 255, 0.1); padding: 20px; border-radius: 8px;">
              <div style="color: var(--primary); font-size: 12px; text-transform: uppercase;">Total Students</div>
              <div style="font-size: 32px; font-weight: bold; color: var(--primary);">${data.totalStudents}</div>
            </div>
            <div style="background: rgba(131, 56, 236, 0.1); padding: 20px; border-radius: 8px;">
              <div style="color: var(--accent); font-size: 12px; text-transform: uppercase;">Avg Score</div>
              <div style="font-size: 32px; font-weight: bold; color: var(--accent);">${data.avgScore}%</div>
            </div>
            <div style="background: rgba(255, 0, 110, 0.1); padding: 20px; border-radius: 8px;">
              <div style="color: var(--secondary); font-size: 12px; text-transform: uppercase;">Avg Attendance</div>
              <div style="font-size: 32px; font-weight: bold; color: var(--secondary);">${data.avgAttendance}%</div>
            </div>
          </div>
        `;
        document.getElementById('analyticsData').innerHTML = html;
        showToast('📊 Report generated');
      } catch (error) {
        showToast('❌ Error generating analytics');
      }
    }

    // Physics Simulations
    let simType = 'gravity';

    function runSimulation(type) {
      simType = type;
      const canvas = document.getElementById('simCanvas');
      const ctx = canvas.getContext('2d');

      if (animationId) cancelAnimationFrame(animationId);

      let time = 0;
      const animate = () => {
        ctx.fillStyle = 'rgba(10, 14, 39, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        switch(type) {
          case 'gravity':
            drawGravity(ctx, time);
            break;
          case 'pendulum':
            drawPendulum(ctx, time);
            break;
          case 'spring':
            drawSpring(ctx, time);
            break;
          case 'wave':
            drawWave(ctx, time);
            break;
        }

        time += 0.05;
        animationId = requestAnimationFrame(animate);
      };
      animate();
      showToast(`🔬 ${type.toUpperCase()} simulation running`);
    }

    function drawGravity(ctx, time) {
      const particles = [
        { x: 200, y: 50 + time * 2, size: 8 },
        { x: 400, y: 100 + time * 1.5, size: 10 }
      ];

      particles.forEach(p => {
        if (p.y < 300) {
          ctx.fillStyle = 'rgba(0, 217, 255, 0.7)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function drawPendulum(ctx, time) {
      const centerX = 400, centerY = 50;
      const length = 150;
      const angle = Math.sin(time / 10) * 0.5;

      const x = centerX + Math.sin(angle) * length;
      const y = centerY + Math.cos(angle) * length;

      ctx.strokeStyle = 'rgba(0, 217, 255, 0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(x, y);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 0, 110, 0.8)';
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSpring(ctx, time) {
      ctx.strokeStyle = 'rgba(131, 187, 111, 0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();

      for (let i = 0; i < 100; i++) {
        const x = (i / 100) * 800;
        const y = 150 + Math.sin((i / 100) * Math.PI * 8 + time / 5) * 40;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function drawWave(ctx, time) {
      ctx.strokeStyle = 'rgba(0, 217, 255, 0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();

      for (let x = 0; x < 800; x += 10) {
        const y = 150 + Math.sin((x / 100) + time / 3) * 50;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.strokeStyle = 'rgba(131, 56, 236, 0.6)';
      ctx.beginPath();
      for (let x = 0; x < 800; x += 10) {
        const y = 150 + Math.sin((x / 100) + time / 3 + Math.PI / 4) * 50;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // Attendance
    async function updateAttendance() {
      const apiUrl = localStorage.getItem('apiUrl');
      for (const student of students) {
        try {
          await fetch(`${apiUrl}/api/students/${student.id}/attendance`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({ classId: currentClassId, present: Math.random() > 0.2 })
          });
        } catch (error) {}
      }
      drawAttendanceChart();
    }

    async function drawAttendanceChart() {
      const canvas = document.getElementById('attendanceCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(10, 14, 39, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = 80;
      const maxHeight = 200;

      students.forEach((s, idx) => {
        const x = 20 + idx * 90;
        const height = (s.attendance / 100) * maxHeight;

        const gradient = ctx.createLinearGradient(x, 250 - height, x, 250);
        gradient.addColorStop(0, 'rgba(0, 217, 255, 0.8)');
        gradient.addColorStop(1, 'rgba(255, 0, 110, 0.8)');

        ctx.fillStyle = gradient;
        ctx.fillRect(x, 250 - height, barWidth, height);
      });
    }

    // Export
    async function exportToCSV() {
      const apiUrl = localStorage.getItem('apiUrl');
      window.open(`${apiUrl}/api/classes/${currentClassId}/export/csv`);
      showToast('📥 CSV downloaded');
    }

    async function exportToJSON() {
      const apiUrl = localStorage.getItem('apiUrl');
      window.open(`${apiUrl}/api/classes/${currentClassId}/export/json`);
      showToast('📤 JSON downloaded');
    }

    // Utilities
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Initialize
    window.addEventListener('load', () => {
      if (authToken && currentUserId) {
        showDashboard();
        initSocket();
      }
    });
  </script>
</body>
</html>
